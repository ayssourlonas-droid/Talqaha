<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talqaha</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23075a26'/%3E%3Ccircle cx='28' cy='28' r='15' fill='%2314864a' stroke='%23ffd21f' stroke-width='6'/%3E%3Cpath d='M39 40l13 13' stroke='%23ffd21f' stroke-width='7' stroke-linecap='round'/%3E%3Cellipse cx='23' cy='22' rx='5' ry='3' fill='%23fff' opacity='.5' transform='rotate(-30 23 22)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--g:#2e9e5b;--gl:#e8f6ee;--gd:#1d6b3c;--t:#1f2a24;--m:#6b7a71}
  *{box-sizing:border-box;margin:0;font-family:Tahoma,Arial,sans-serif}
  body{background:var(--gl);color:var(--t)}
  header{background:var(--g);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
  header h1{font-size:20px}
  .btn{background:#fff;color:var(--gd);border:0;padding:8px 14px;border-radius:8px;font-weight:bold;cursor:pointer}
  .burger{background:transparent;border:0;cursor:pointer;display:flex;flex-direction:column;gap:5px;padding:6px}
  .burger span{display:block;width:24px;height:3px;background:#fff;border-radius:2px}
  .hl{display:flex;align-items:center;gap:12px}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
  .overlay.open{display:block}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(78vw,300px);background:#fff;z-index:21;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:none}
  .drawer.open{transform:translateX(0);box-shadow:-6px 0 24px rgba(0,0,0,.2)}
  .dhead{background:var(--g);color:#fff;padding:16px;font-weight:bold;display:flex;justify-content:space-between;align-items:center}
  .dclose{background:transparent;border:0;color:#fff;font-size:22px;cursor:pointer}
  .ditems{flex:1;padding:8px 0;overflow-y:auto}
  .ditem{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid #eef3ef;padding:15px 18px;font-size:16px;color:var(--t);cursor:pointer;text-align:right}
  .ditem:hover{background:var(--gl)}
  .ditem.pub{color:var(--gd);font-weight:bold}
  .dfoot{padding:16px;border-top:1px solid #eef3ef}
  .login{width:100%;background:var(--g);color:#fff;border:0;padding:12px;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
  .login.out{background:#fff;color:#b33;border:1px solid #e3b4b4}
  .who{margin-bottom:10px;font-size:14px;color:var(--m)}
  .authbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;align-items:center;justify-content:center;padding:16px}
  .authbox.open{display:flex}
  .authcard{position:relative;background:#fff;border-radius:16px;padding:22px 18px 18px;width:min(100%,380px);display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow-y:auto}
  .aclose{position:absolute;top:8px;left:10px;background:none;border:0;font-size:20px;color:var(--m);cursor:pointer}
  .tabs{display:flex;background:var(--gl);border-radius:10px;padding:4px;margin-top:14px}
  .tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:8px;font-size:15px;cursor:pointer;color:var(--gd)}
  .tabs button.on{background:var(--g);color:#fff;font-weight:bold}
  .authcard input{width:100%;padding:12px;border:1px solid #cfe3d6;border-radius:10px;font-size:15px}
  .rl{font-size:14px;color:var(--m);margin-bottom:6px}
  .roles{display:flex;gap:10px}
  .roles button{flex:1;background:#fff;border:2px solid #cfe3d6;border-radius:12px;padding:12px 6px;cursor:pointer;font-size:15px;font-weight:bold;color:var(--t)}
  .roles button span{display:block;font-size:26px}
  .roles button small{display:block;font-weight:normal;font-size:11px;color:var(--m);margin-top:4px}
  .roles button.on{border-color:var(--g);background:var(--gl)}
  .amsg{color:#b33;font-size:13px;min-height:16px}
  .asubmit{background:var(--g);color:#fff;border:0;padding:13px;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
  .search{display:flex;gap:8px;padding:16px;flex-wrap:wrap;background:#fff}
  .search input,.search select{padding:10px;border:1px solid #cfe3d6;border-radius:8px;font-size:15px}
  .search input{flex:1;min-width:180px}
  .search button{background:var(--g);color:#fff;border:0;padding:10px 20px;border-radius:8px;cursor:pointer}
  .search{position:relative}
  .search .wbtn{background:#fff;color:var(--gd);border:1px solid #cfe3d6;font-size:15px;font-weight:bold}
  .wpanel{display:none;position:absolute;top:100%;left:16px;right:16px;z-index:10;background:#fff;border:1px solid #cfe3d6;border-radius:12px;padding:12px;box-shadow:0 8px 24px rgba(29,107,60,.18);grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;max-height:60vh;overflow-y:auto}
  .wpanel.open{display:grid}
  .wchip{background:var(--gl);color:var(--gd);border:1px solid transparent;border-radius:20px;padding:8px 6px;text-align:center;font-size:14px;cursor:pointer}
  .wchip:hover{border-color:var(--g)}
  .wchip.active{background:var(--g);color:#fff;font-weight:bold}
  .wchip.all{grid-column:1/-1;background:var(--gd);color:#fff}
  .wchip.near{background:#fff4d6;color:#8a6d1d;border-color:#f0dc9a}
  .wlegend{grid-column:1/-1;font-size:12px;color:var(--m);display:flex;gap:14px;align-items:center}
  .wlegend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-left:5px;vertical-align:middle}
  .wlegend .d1{background:var(--g)}
  .wlegend .d2{background:#f3d98b}
  .search .wdone{grid-column:1/-1;padding:8px}
  section{padding:16px}
  h2{font-size:17px;margin-bottom:10px;color:var(--gd)}
  .cats{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
  .cat{background:#fff;border-radius:12px;padding:12px 16px;white-space:nowrap;text-align:center;min-width:100px;border:1px solid #cfe3d6;cursor:pointer}
  .cat span{display:block;font-size:26px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #cfe3d6}
  .img{height:120px;background:#d5ecdd;display:flex;align-items:center;justify-content:center;font-size:40px}
  .info{padding:10px}
  .info h3{font-size:15px;margin-bottom:4px}
  .price{color:var(--g);font-weight:bold}
  .meta{font-size:12px;color:var(--m);margin-top:4px}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--gl);color:var(--gd);margin-top:6px}
  .tag.bad{background:#fdecec;color:#b33}
  footer{text-align:center;padding:20px;font-size:12px;color:var(--m)}

  /* ===== لمسة ناعمة ===== */
  :root{--g:#2e9e5b;--gl:#e8f6ee;--gd:#1d6b3c;--t:#1f2a24;--m:#6b7a71}
  *{font-family:'Cairo',Tahoma,Arial,sans-serif}
  body{background:var(--gl)}
  header{background:var(--g);color:#fff;padding:10px 16px;border-radius:0 0 24px 24px;box-shadow:0 4px 14px rgba(29,107,60,.18);position:sticky;top:0;z-index:5}
  header h1{color:#fff;font-size:18px;font-weight:700}
  .burger span{background:#fff;width:20px;height:2.5px;border-radius:3px}
  .search{background:transparent;padding:18px 16px 6px}
  .search input{background:#fff;border:1px solid #e1eee6;border-radius:999px;padding:10px 16px;font-size:14px;box-shadow:0 2px 10px rgba(43,122,80,.06)}
  .search input:focus{outline:none;border-color:var(--g)}
  .search button{border-radius:999px;padding:8px 18px;font-size:14px;font-weight:600}
  .search .wbtn{border-radius:999px;padding:8px 14px;font-size:14px;border:1px solid #e1eee6;box-shadow:0 2px 10px rgba(43,122,80,.06)}
  section{padding:14px 16px}
  h2{font-weight:700;font-size:18px;color:var(--t);margin-bottom:12px}
  .cat{border-radius:20px;border:1px solid #e6f1ea;box-shadow:0 2px 8px rgba(43,122,80,.05);transition:.2s;padding:8px 12px;min-width:84px;font-size:13px}
  h2.sm{font-size:12px;color:var(--m);font-weight:600;margin-bottom:8px}
  .cats{gap:8px;padding:8px 2px 12px}
  .cat{display:flex;align-items:center;min-width:0;padding:7px 10px;border-radius:999px;font-size:13px}
  .cat span{display:inline;font-size:19px;line-height:1.3}
  .cat b{max-width:0;overflow:hidden;white-space:nowrap;font-weight:600;transition:max-width .3s,margin .3s}
  .cat.on{background:var(--g);color:#fff;border-color:var(--g)}
  .cat.on b{max-width:150px;margin-right:6px}
  .cat:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(43,122,80,.12)}
  .card{border-radius:22px;border:0;box-shadow:0 4px 16px rgba(43,122,80,.09);transition:.2s}
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(43,122,80,.14)}
  .img{height:130px;background:linear-gradient(135deg,#e6f5ed,#cfe9db)}
  .info{padding:12px 14px 14px}
  .price{font-size:16px}
  .tag{background:#eaf6ef;border-radius:12px;padding:3px 10px}
  .tag.bad{background:#fdf0ee;color:#b5483b}
  .dhead{background:var(--g);color:#fff;font-size:16px;padding:12px 16px}
  .dclose,.aclose{width:30px;height:30px;padding:0;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s}
  .dclose{background:rgba(255,255,255,.22);color:#fff}
  .dclose:hover{background:rgba(255,255,255,.35)}
  .aclose{background:#eef3ef;color:var(--m)}
  .aclose:hover{background:#e0eae3}
  .ditem{padding:11px 18px;font-size:15px}
  .dfoot{text-align:center}
  .drawer{border-radius:22px 0 0 22px;overflow:hidden}
  .wpanel{border-radius:18px;border:0}
  .wchip{border-radius:22px;padding:6px 4px;font-size:13px}
  .wpanel{position:fixed;left:50%;right:auto;top:50%;transform:translate(-50%,-50%);width:min(92vw,420px);z-index:40;border-radius:20px}
  .wback{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:39}
  .wback.open{display:block}
  .wdone{grid-column:1/-1;padding:9px;border:0;border-radius:999px;background:var(--g);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
  header{min-height:66px}
  .logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;line-height:0}
  .logo img{height:60px;width:auto;display:block}
  .alertbtn{width:30px;height:30px;border-radius:50%;border:0;background:#fff;color:var(--gd);font-weight:700;font-size:17px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .alertbtn.new{animation:pulse 1.3s ease-out infinite,tint 2.6s ease-in-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,210,77,.85)}70%{box-shadow:0 0 0 12px rgba(255,210,77,0)}100%{box-shadow:0 0 0 0 rgba(255,210,77,0)}}
  @keyframes tint{0%,100%{background:#fff;color:var(--gd)}50%{background:#ffd24d;color:#7a4b00}}
  .infocard{text-align:center;align-items:center;gap:14px}
  .infocard p{font-size:15px;line-height:1.8;color:var(--t)}
  .ibig{width:46px;height:46px;border-radius:50%;background:#fff4d6;color:#8a6d1d;font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:8px}
  .wnow{width:fit-content;margin:2px 16px 0 auto;font-size:11px;color:var(--gd);background:#fff;border-radius:999px;padding:3px 10px;box-shadow:0 1px 6px rgba(43,122,80,.1);cursor:pointer}
  .login{width:auto;min-width:150px;padding:8px 22px;font-size:14px;border-radius:999px}
  .asubmit{border-radius:999px;padding:10px;font-size:15px;align-self:center;min-width:150px}
  .authcard{border-radius:22px}
  .tabs{background:#eef6f1;border-radius:14px}
  footer{padding:26px 16px}

  /* ===== خلفية بنفس تدرج الشعار ===== */
  body{background:#013417 radial-gradient(ellipse 50% 200% at 50% 50%, #08712a 0%, #08712a 12%, #056b2b 21%, #056429 28%, #045c25 38%, #035422 46%, #034d1f 54%, #02461d 62%, #02411b 71%, #023c1a 79%, #013718 88%, #013417 100%) fixed;min-height:100vh}
  h2{color:#eafaf0}
  h2.sm{color:#a6d9b9}
  .grid{color:#d8f2e1}
  .card{color:var(--t)}

  /* ===== نموذج نشر الإعلان ===== */
  .postcard{width:min(100%,460px);gap:13px}
  .postcard h3.pt{font-size:18px;color:var(--gd);margin:6px 0 0;text-align:center}
  .postcard h4{font-size:13px;color:var(--gd);margin:4px 0 -4px;font-weight:700}
  .fl2{display:flex;flex-direction:column;gap:5px}
  .fl2 label{font-size:13px;color:var(--m);font-weight:600}
  .postcard input,.postcard select,.postcard textarea{width:100%;padding:11px 12px;border:1px solid #cfe3d6;border-radius:12px;font-size:15px;background:#fff;color:var(--t);font-family:inherit}
  .postcard input:focus,.postcard select:focus,.postcard textarea:focus{outline:none;border-color:var(--g)}
  .postcard textarea{min-height:72px;resize:vertical}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap}
  .thumb{position:relative;width:64px;height:64px;border-radius:12px;overflow:hidden;border:1px solid #cfe3d6}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb button{position:absolute;top:3px;left:3px;width:20px;height:20px;border:0;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:12px;cursor:pointer;line-height:1;padding:0}
  .addph{width:64px;height:64px;border:2px dashed #9cc9ad;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--g);cursor:pointer;background:var(--gl)}
  .feenote{background:#fff4d6;color:#8a6d1d;border-radius:12px;padding:9px 12px;font-size:13px;line-height:1.7}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--gd);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:60;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .img img{width:100%;height:100%;object-fit:cover;display:block}
</style>
</head>

<script>
const ads = [
  {t:"سماعة بلوتوث JBL Tune 510BT",c:"سماعات بلوتوث",p:95,w:"صفاقس",s:"جديد",warranty:"سنة (الوكيل)",defect:"",views:320,e:"🎧"},
  {t:"شاحن سريع Samsung 25W",c:"شواحن",p:35,w:"تونس",s:"جديد",warranty:"3 أشهر (البائع)",defect:"",views:210,e:"🔌"},
  {t:"هاتف Samsung Galaxy A14 128GB",c:"هواتف",p:520,w:"سوسة",s:"مستعمل",warranty:"بدون",defect:"خدش بسيط في الشاشة",views:480,e:"📱"},
  {t:"سماعة سلكية Sony MDR-ZX110",c:"سماعات",p:40,w:"نابل",s:"جديد",warranty:"شهر (البائع)",defect:"",views:90,e:"🎧"},
  {t:"سماعات Xiaomi Redmi Buds 4",c:"سماعات بلوتوث",p:75,w:"تونس",s:"مستعمل",warranty:"بدون",defect:"علبة الشحن بها خدوش",views:150,e:"📶"}
];
let cat="";
let sel=[];
const wilayas=["تونس","أريانة","بن عروس","منوبة","نابل","زغوان","بنزرت","باجة","جندوبة","الكاف","سليانة","القصرين","سيدي بوزيد","القيروان","سوسة","المنستير","المهدية","صفاقس","قفصة","توزر","قبلي","قابس","مدنين","تطاوين"];
const edges={
  "تونس":["أريانة","بن عروس","منوبة"],
  "أريانة":["منوبة","بنزرت"],
  "بن عروس":["منوبة","نابل","زغوان"],
  "منوبة":["بنزرت","باجة","زغوان"],
  "نابل":["زغوان","سوسة"],
  "زغوان":["باجة","سليانة","القيروان","سوسة"],
  "بنزرت":["باجة"],
  "باجة":["جندوبة","سليانة"],
  "جندوبة":["الكاف","سليانة"],
  "الكاف":["سليانة","القصرين"],
  "سليانة":["القصرين","القيروان"],
  "القصرين":["القيروان","سيدي بوزيد","قفصة"],
  "سيدي بوزيد":["القيروان","صفاقس","قفصة","قابس"],
  "القيروان":["صفاقس","المهدية","سوسة"],
  "سوسة":["المنستير","المهدية"],
  "المنستير":["المهدية"],
  "المهدية":["صفاقس"],
  "صفاقس":["قابس"],
  "قفصة":["قابس","توزر","قبلي"],
  "توزر":["قبلي"],
  "قبلي":["قابس","مدنين","تطاوين"],
  "قابس":["مدنين"],
  "مدنين":["تطاوين"],
  "تطاوين":[]
};
const adj={};
wilayas.forEach(n=>adj[n]=new Set());
Object.keys(edges).forEach(a=>edges[a].forEach(b=>{adj[a].add(b);adj[b].add(a)}));

function buildW(){
  const p=document.getElementById("wpanel");
  p.innerHTML=`<div class="wchip all" onclick="clearW()">كل الولايات</div>`+
    `<div class="wlegend"><span><i class="d1"></i>محددة</span><span><i class="d2"></i>مجاورة</span></div>`+
    wilayas.map(n=>`<div class="wchip" data-n="${n}" onclick="pickW('${n}')">${n}</div>`).join("")+
    `<button type="button" class="wdone" onclick="closeW()">تم</button>`;
  refreshW();
}
function refreshW(){
  const near=new Set();
  sel.forEach(s=>adj[s].forEach(x=>{if(!sel.includes(x))near.add(x)}));
  document.querySelectorAll(".wchip[data-n]").forEach(c=>{
    const n=c.dataset.n;
    c.classList.toggle("active",sel.includes(n));
    c.classList.toggle("near",near.has(n));
  });
  renderMenu();
  save();
  const ind=document.getElementById("wind");
  if(ind)ind.textContent="📍 "+wLabel();
}
function wLabel(){
  return !sel.length?"كل الولايات":sel.length===1?sel[0]:sel[0]+" +"+(sel.length-1);
}
function save(){try{localStorage.setItem("wil",JSON.stringify(sel))}catch(e){}}
function load(){
  try{
    const v=JSON.parse(localStorage.getItem("wil")||"[]");
    if(Array.isArray(v))sel=v.filter(x=>wilayas.includes(x));
  }catch(e){}
}
function openW(){
  if(document.getElementById("drawer").classList.contains("open"))toggleMenu();
  buildW();
  document.getElementById("wpanel").classList.add("open");
  document.getElementById("wback").classList.add("open");
}
function closeW(){
  document.getElementById("wpanel").classList.remove("open");
  document.getElementById("wback").classList.remove("open");
}
function pickW(n){
  sel=sel.includes(n)?sel.filter(x=>x!==n):[...sel,n];
  refreshW();
  render();
}
function clearW(){
  sel=[];
  refreshW();
  render();
}
let user=null;
let mode="login";
let role="";
const accounts=[]; // تجريبي: في الذاكرة فقط، ويُستبدل لاحقًا بخادم حقيقي
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderMenu(){
  const it=[["📍","ولايتي: "+wLabel(),false,"openW()"]];
  if(user&&user.role==="seller")it.push(["➕","انشر إعلانك",true,"openPost()"],["📋","إعلاناتي"]);
  if(!user||user.role==="buyer")it.push(["❤️","المفضلة"]);
  if(user)it.push(["💬","المحادثات"]);
  it.push(["⚙️","الإعدادات"]);
  document.getElementById("ditems").innerHTML=it.map(i=>`<button class="ditem${i[2]?" pub":""}"${i[3]?` onclick="${i[3]}"`:""}>${i[0]} ${i[1]}</button>`).join("");
  document.getElementById("dfoot").innerHTML=user
    ?`<div class="who">👤 ${esc(user.name)} • ${user.role==="seller"?"بائع":"مشتري"}</div><button class="login out" onclick="logout()">تسجيل الخروج</button>`
    :`<button class="login" onclick="openAuth('login')">تسجيل الدخول</button>`;
}
function openAuth(m){
  if(document.getElementById("drawer").classList.contains("open"))toggleMenu();
  setMode(m);
  document.getElementById("authbox").classList.add("open");
}
function closeAuth(){document.getElementById("authbox").classList.remove("open")}
function setMode(m){
  mode=m;
  document.getElementById("tabL").classList.toggle("on",m==="login");
  document.getElementById("tabS").classList.toggle("on",m==="signup");
  document.getElementById("fname").style.display=m==="signup"?"block":"none";
  document.getElementById("froles").style.display=m==="signup"?"block":"none";
  document.getElementById("asubmit").textContent=m==="login"?"دخول":"إنشاء الحساب";
  document.getElementById("amsg").textContent="";
}
function pickRole(r){
  role=r;
  document.getElementById("rb").classList.toggle("on",r==="buyer");
  document.getElementById("rs").classList.toggle("on",r==="seller");
}
function submitAuth(e){
  e.preventDefault();
  const phone=document.getElementById("fphone").value.trim();
  const pass=document.getElementById("fpass").value;
  const name=document.getElementById("fnameIn").value.trim();
  const msg=document.getElementById("amsg");
  if(!/^\d{8}$/.test(phone)){msg.textContent="أدخل رقم هاتف تونسي من 8 أرقام";return}
  if(pass.length<6){msg.textContent="كلمة المرور 6 أحرف على الأقل";return}
  if(mode==="signup"){
    if(!name){msg.textContent="أدخل اسمك";return}
    if(!role){msg.textContent="اختر: بائع أم مشتري";return}
    if(accounts.some(a=>a.phone===phone)){msg.textContent="هذا الرقم مسجّل من قبل";return}
    accounts.push({name,phone,pass,role});
    user={name,role,phone};
  }else{
    const acc=accounts.find(a=>a.phone===phone&&a.pass===pass);
    if(!acc){msg.textContent="بيانات غير صحيحة";return}
    user={name:acc.name,role:acc.role,phone:acc.phone};
  }
  closeAuth();
  renderMenu();
}
function logout(){user=null;renderMenu();toggleMenu()}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeAuth();closeW();closeInfo()}});
function toggleMenu(){
  document.getElementById("drawer").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("open");
}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&document.getElementById("drawer").classList.contains("open"))toggleMenu();
});
function setCat(c){
  cat=c;
  document.querySelectorAll(".cat").forEach(x=>x.classList.toggle("on",x.dataset.c===c));
  render();
}
function card(a){
  const img=(a.photos&&a.photos[0])?`<img alt="" src="${esc(a.photos[0])}">`:esc(a.e);
  return `<div class="card"><div class="img">${img}</div><div class="info">
  <h3>${esc(a.t)}</h3><div class="price">${esc(a.p)} د.ت</div>
  <div class="meta">${esc(a.w)} • ${esc(a.s)} • 👁 ${esc(a.views)}</div>
  <span class="tag">الضمان: ${esc(a.warranty)}</span>
  ${a.defect?`<br><span class="tag bad">عيب: ${esc(a.defect)}</span>`:""}
  </div></div>`;
}
function render(){
  const q=document.getElementById("q").value.trim();
  const list=ads.filter(a=>(!cat||a.c===cat)&&(!sel.length||sel.includes(a.w))&&(!q||a.t.includes(q)));
  document.getElementById("top").innerHTML=[...list].sort((x,y)=>y.views-x.views).slice(0,3).map(card).join("")||"لا نتائج";
  document.getElementById("latest").innerHTML=list.map(card).join("")||"لا نتائج";
}
function openInfo(){
  document.getElementById("infobox").classList.add("open");
  document.getElementById("info").classList.remove("new");
  try{localStorage.setItem("seen","1")}catch(e){}
}
function closeInfo(){document.getElementById("infobox").classList.remove("open")}
try{
  if(!localStorage.getItem("seen"))document.getElementById("info").classList.add("new");
}catch(e){
  document.getElementById("info").classList.add("new");
}

/* ===== نشر الإعلان ===== */
const FREE_PERIOD=true, FEE=1.5;
const CATS=["سماعات","سماعات بلوتوث","شواحن","هواتف"];
const CAT_EMOJI={"سماعات":"🎧","سماعات بلوتوث":"📶","شواحن":"🔌","هواتف":"📱"};
const FEATURES={
  "سماعات":[["نوع التوصيل","sel",["3.5 ملم","USB-C","Lightning"]],["بميكروفون","sel",["نعم","لا"]]],
  "سماعات بلوتوث":[["إصدار البلوتوث","sel",["4.x","5.0","5.1","5.2","5.3","5.4"]],["مدة البطارية (ساعات)","num"],["إلغاء الضوضاء","sel",["نعم","لا"]]],
  "شواحن":[["القدرة (واط)","num"],["نوع المنفذ","sel",["USB-A","USB-C","Lightning","Micro-USB"]],["الشحن السريع","sel",["نعم","لا"]]],
  "هواتف":[["الذاكرة الداخلية","sel",["32GB","64GB","128GB","256GB","512GB","1TB"]],["الرام","sel",["2GB","3GB","4GB","6GB","8GB","12GB"]],["صحة البطارية %","num"],["مع العلبة والشاحن","sel",["نعم","لا"]]]
};
let photos=[];
const $=id=>document.getElementById(id);

function toast(m){
  const t=$("toast");t.textContent=m;t.classList.add("show");
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2800);
}
function initPost(){
  $("pf_c").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");
  $("pf_w").innerHTML=`<option value="">اختر الولاية</option>`+wilayas.map(w=>`<option>${w}</option>`).join("");
  $("feenote").textContent=FREE_PERIOD
    ?"النشر مجاني خلال فترة التأسيس، ويبقى إعلانك ظاهرًا 30 يومًا."
    :`رسم النشر ${FEE} د.ت، ويبقى إعلانك ظاهرًا 30 يومًا.`;
}
function buildFeat(){
  const c=$("pf_c").value;
  $("pf_feat").innerHTML=(FEATURES[c]||[]).map((f,i)=>{
    const id="ft_"+i;
    const input=f[1]==="sel"
      ?`<select id="${id}" data-l="${esc(f[0])}"><option value="">—</option>${f[2].map(o=>`<option>${esc(o)}</option>`).join("")}</select>`
      :`<input id="${id}" data-l="${esc(f[0])}" type="number" inputmode="decimal" min="0" max="100000">`;
    return `<div class="fl2"><label for="${id}">${esc(f[0])}</label>${input}</div>`;
  }).join("");
}
function toggles(){
  $("pf_wpbox").style.display=$("pf_wr").value==="بدون"?"none":"flex";
  $("pf_dtbox").style.display=$("pf_d").value==="yes"?"flex":"none";
}
function renderPhotos(){
  $("thumbs").innerHTML=photos.map((src,i)=>`<div class="thumb"><img alt="" src="${esc(src)}"><button type="button" onclick="rmPhoto(${i})" aria-label="حذف">✕</button></div>`).join("")
    +(photos.length<4?`<div class="addph" onclick="$('pf_img').click()">＋</div>`:"");
}
function rmPhoto(i){photos.splice(i,1);renderPhotos()}
function addPhotos(files){
  const room=4-photos.length;
  [...files].slice(0,room).forEach(f=>{
    if(!f.type.startsWith("image/"))return;
    const r=new FileReader();
    r.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const max=800,k=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement("canvas");
        c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
        c.getContext("2d").drawImage(im,0,0,c.width,c.height);
        if(photos.length<4){photos.push(c.toDataURL("image/jpeg",.72));renderPhotos();$("pmsg").textContent=""}
      };
      im.src=r.result;
    };
    r.readAsDataURL(f);
  });
  $("pf_img").value="";
}
function openPost(){
  if(!user||user.role!=="seller"){openAuth("signup");return}
  if($("drawer").classList.contains("open"))toggleMenu();
  $("postform").reset();
  photos=[];renderPhotos();buildFeat();toggles();
  $("pf_ph").value=user.phone||"";
  $("pf_w").value=sel[0]||"";
  $("pmsg").textContent="";
  $("postbox").classList.add("open");
}
function closePost(){$("postbox").classList.remove("open")}
function submitPost(e){
  e.preventDefault();
  const msg=$("pmsg");
  const t=$("pf_t").value.trim(), c=$("pf_c").value, s=$("pf_s").value;
  const p=Number($("pf_p").value), w=$("pf_w").value;
  const wr=$("pf_wr").value, hasDef=$("pf_d").value==="yes", dt=$("pf_dt").value.trim();
  const ph=$("pf_ph").value.trim();
  if(t.length<6){msg.textContent="اكتب الاسم الكامل للمنتج (6 أحرف على الأقل)";return}
  if(!(p>0&&p<=100000)){msg.textContent="أدخل سعرًا صحيحًا";return}
  if(!w){msg.textContent="اختر الولاية";return}
  if(hasDef&&dt.length<4){msg.textContent="صِف العيب أو اختر «لا، لا يوجد»";return}
  if(!photos.length){msg.textContent="أضف صورة واحدة على الأقل";return}
  if(!/^\d{8}$/.test(ph)){msg.textContent="أدخل رقم هاتف من 8 أرقام";return}
  const features={};
  document.querySelectorAll("#pf_feat [data-l]").forEach(x=>{if(x.value!=="")features[x.dataset.l]=x.value});
  const ad={
    id:Date.now(),type:"product",t,c,p,w,s,
    warranty:wr==="بدون"?"بدون":`${wr} (${$("pf_wp").value})`,
    defect:hasDef?dt:"",
    features,desc:$("pf_desc").value.trim(),
    photos:[...photos],e:CAT_EMOJI[c]||"📦",views:0,
    contact:{phone:ph,whatsapp:$("pf_wa").value==="yes"},
    seller:{name:user.name,phone:user.phone||ph},
    created:Date.now(),mine:true
  };
  ads.unshift(ad);
  saveMine();
  closePost();
  setCat("");
  toast("تم نشر إعلانك ✓");
}
function saveMine(){
  try{localStorage.setItem("myAds",JSON.stringify(ads.filter(a=>a.mine)))}catch(e){
    try{localStorage.setItem("myAds",JSON.stringify(ads.filter(a=>a.mine).map(a=>({...a,photos:[]}))))}catch(e2){}
  }
}
function loadMine(){
  try{
    const v=JSON.parse(localStorage.getItem("myAds")||"[]");
    if(Array.isArray(v))v.reverse().forEach(a=>{if(a&&a.t&&a.id)ads.unshift(a)});
  }catch(e){}
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePost()});
$("postform").addEventListener("input",()=>{$("pmsg").textContent=""});
$("postform").addEventListener("change",()=>{$("pmsg").textContent=""});
initPost();loadMine();

load();
refreshW();
render();
</script>
</body>
</html>
